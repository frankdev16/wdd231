<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack - Discover Movies</title>

    <meta name="description" content="Explore, search, and curate your personalized movie watchlist with CineTrack.">
    <meta name="author" content="Franklin Anyaogu">

    <meta property="og:title" content="CineTrack - Discover Movies">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://frankdev16.github.io/wdd231/final/index.html">
    <meta property="og:image" content="https://frankdev16.github.io/wdd231/final/images/cinetrack-hero.webp">
    <meta property="og:description"
        content="Explore, search, and curate your personalized movie watchlist with CineTrack.">

    <!-- Added Favicon -->
    <link rel="icon" href="/images/favicon.ico">

    <!-- PERFORMANCE BOOSTERS -->
    <link rel="preconnect" href="https://api.themoviedb.org">
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="modulepreload" href="scripts/main.js">
    <link rel="modulepreload" href="scripts/api.js">
    <link rel="modulepreload" href="scripts/storage.js">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script type="module" src="scripts/main.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <span class="logo-title">CineTrack</span>
        </div>

        <nav>
            <button id="nav-btn" class="hamburger" aria-label="Toggle Menu">&#9776;</button>
            <ul id="nav-menu">
                <li class="current"><a href="index.html">Home</a></li>
                <li><a href="watchlist.html">My Watchlist</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="visually-hidden">CineTrack - Discover Trending Movies</h1>
        <!-- HERO BANNER -->
        <section class="hero-banner">
            <img id="hero-image" src="https://frankdev16.github.io/wdd231/final/images/cinetrack-hero.webp"
alt="Featured Movie Banner" fetchpriority="high">
            <div class="hero-overlay">
                <h2 id="hero-title">Loading trending movies...</h2>
                <p id="hero-plot"></p>
            </div>
        </section>

        <section class="search-section">
            <form id="search-form" action="search.html" method="GET" class="search-form">
                <input id="search-input" type="text" name="query" placeholder="Search for a movie..." required>
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="movie-display">
            <h2>Trending Now</h2>
            <div id="movie-grid" class="grid-container">
                <!-- JavaScript will inject the movie cards here -->
            </div>

            <div class="load-more-container">
                <button id="load-more-btn" class="load-more-btn">Load More</button>
            </div>
        </section>
    </main>

    <dialog id="movie-modal">
        <div class="modal-content">
            <button id="close-modal" aria-label="Close">&times;</button>
            <img id="modal-poster" src="" alt="Movie Poster">
            <h2 id="modal-title">Movie Title</h2>
            <p id="modal-plot">Movie plot goes here.</p>
            <button id="add-watchlist-btn" class="watchlist-btn">Add to Watchlist</button>
        </div>
    </dialog>

    <footer>
        <div class="dev-info">
            <p>&copy; <span id="currentyear"></span> CineTrack | Franklin Anyaogu | WDD 231</p>
            <p id="lastModified"></p>
        </div>
    </footer>
</body>

</html>
