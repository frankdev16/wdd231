<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack - Search Results</title>

    <meta name="description" content="Search for your favorite movies and add them to your CineTrack watchlist.">
    <meta name="author" content="Franklin Anyaogu">

    <meta property="og:title" content="CineTrack - Search Results">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://frankdev16.github.io/wdd231/final/search.html">
    <meta property="og:image" content="https://frankdev16.github.io/wdd231/final/images/cinetrackhero.webp">
    <meta property="og:description" content="Search for your favorite movies and add them to your CineTrack watchlist.">

    <link rel="icon" href="images/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script type="module" src="scripts/main.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <span class="logo-title">CineTrack</span>
        </div>

        <nav>
            <button id="nav-btn" class="hamburger" aria-label="Toggle Menu">&#9776;</button>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="watchlist.html">My Watchlist</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="visually-hidden">CineTrack Search Results</h1>

        <section class="search-section">
            <form id="search-form" action="search.html" method="GET" class="search-form">
                <input id="search-input" type="text" name="query" placeholder="Search for a movie..." required>
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="movie-display">
            <h2>Search Results</h2>
            <div id="search-results-grid" class="grid-container">
                <!-- JavaScript will inject the searched movie cards here -->
            </div>
        </section>
    </main>

    <dialog id="movie-modal" class="cinetrack-modal">
        <div class="modal-content">
            <button id="close-modal" aria-label="Close">✕</button>
            <div id="modal-details"></div>
        </div>
    </dialog>

    <footer>
        <div class="dev-info">
            <p>&copy; <span id="currentyear"></span> CineTrack | Franklin Anyaogu | WDD 231</p>
            <p id="lastModified"></p>
        </div>
    </footer>
</body>

</html>
